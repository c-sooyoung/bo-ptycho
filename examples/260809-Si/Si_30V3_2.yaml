job:
  type: "random+sobo"
  random_iters: 100
  sobo_iters: 1000

io:
  input_data_path: '/home/swim/shared/Si_project/data/Si30V3_2.mat'
  result_dir: '/home/swim/bo-ptycho/results/260809-Si/Si30V3_2'
  verbosity: 1

ptycho:
