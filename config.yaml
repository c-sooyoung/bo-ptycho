job:
  type: "test"
  random_iters: 5
  sobo_iters: 10

io:
  input_data_path: '/home/swim/shared/Si_project/data/Si2V1_1.mat'
  result_dir: '/home/swim/bo-ptycho/results/test'
  verbosity: 1

ptycho:
  engine: 'fold_slice'
  path: '/home/swim/fold_slice-stable'
  params:
    voltage: 200
    alpha_max: 30
    defocus: -200
    rot_ang: 0.3
    Nlayers: 5
    thickness: 250
    rbf: 37
    Nprobe: 1
    N_scan_x: 64
    N_scan_y: 64
    tilt_x: 2
    tilt_y: 0 
    scan_step_size: 0.36
    Niter: 5
    Niter_save_results: 5
    CBED_size: 192
    ADU: 1
    extra_print_info: ''
    scan_number: 1
    gpu_id: 1
    roi_label: '0_Ndp64'
    diff_pattern_blur: 1
    probe_change_start: 1
    object_change_start: 1
    grouping: inf
    probe_position_search: 1
    regularize_layers: 0.2
    variable_probe: 'false'
    verbosity

bo:
  batch: 4
  acquisition: 'ucb'
  beta: 0.1 # for ucb only
  metric: 'log_fourier'
  params:
    alpha_max:
    defocus:
      # radius: 100
    rot_ang:
    Nlayers:
      radius: 2
      type: int
    thickness:
      # radius: 100
  train_x:
  train_y:
